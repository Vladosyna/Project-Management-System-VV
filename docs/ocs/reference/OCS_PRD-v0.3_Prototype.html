<title>OCS 统一项目平台 · PRD v0.3 与交互原型</title>
<style>
:root{--brand:#0066ff;--brand-text:#005be6;--navy:#0c1b2b;--alt:#f0f1f6;--rule:#d9d9d9;--muted:#666666}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:#000;background:#fff}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--rule)}
.top .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:15px}
.top .brand img{width:130px;height:auto}
.top .brand span{padding-left:14px;border-left:1px solid var(--rule)}
.tabs{display:flex;gap:4px}
.tabs button,.lang{min-height:40px;padding:0 16px;font:inherit;font-size:14px;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent}
.tabs button.on{border-bottom-color:var(--brand);color:var(--brand-text);font-weight:700}
.lang{border:1px solid var(--brand);border-radius:3.2rem;color:var(--brand-text);font-weight:700;min-height:34px}
#prd{display:flex;flex-wrap:wrap;gap:0;max-width:1320px;margin:0 auto}
#toc{flex:1 1 240px;max-width:280px;padding:24px 16px;border-right:1px solid var(--rule)}
#toc a{display:block;padding:8px 10px;color:#000;text-decoration:none;font-size:14px}
#toc a:hover{background:var(--alt)}
#doc{flex:999 1 560px;min-width:0;padding:24px 36px 80px 36px;font-size:14px;line-height:1.6}
#doc h2{font-size:20px;margin:36px 0 12px 0;padding-top:8px;border-top:1px solid var(--rule)}
#doc h2:first-child{border-top:none;margin-top:0}
#doc h3{font-size:15px;margin:18px 0 6px 0;color:var(--brand-text)}
#doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
#doc th,#doc td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
#doc th{background:#f2f2f2}
#doc table.kv th{width:160px}
#doc .note{background:#dce9f5;padding:14px 16px;margin:14px 0}
#doc ul{padding-left:20px}
#proto{display:none}
#picker{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px;background:var(--alt);border-bottom:1px solid var(--rule)}
#picker button{min-height:36px;padding:0 14px;border:1px solid var(--rule);background:#fff;border-radius:5px;font:inherit;font-size:13px;cursor:pointer}
#picker button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
#stage{background:var(--alt)}
.narrow{display:flex;justify-content:center;padding:32px 16px}
.narrow > div{box-shadow:0 0 35px rgba(0,0,0,.12)}
.hint{padding:8px 24px;font-size:12px;color:var(--muted);background:#fff;border-bottom:1px solid var(--rule)}
</style>
<style id="screen-css"></style>
</head>

  en:{ t:'1. Overview and what changes in v0.2', h:`

<ul>

<li><b>Actions:</b> every action has an owner, a due date and a source; any comment can become an action.</li>

<li><b>Portals:</b> client portal (PMI read-only + approvals + forms, partners anonymised) and partner phone app (checklist, photos).</li>
<li><b>AI assistant:</b> proposes status updates from mail and chats, answers project questions, drafts mails — proposes only; people confirm.</li>
</ul>` } },

{ id:'screens',
  zh:{ t:'4. 页面说明（与原型一一对应）', h:`
<h3>4.1 首页 · 我的工作台</h3><ul><li>指标卡：P0 预警、本周到期行动、14 天内安装、需更正报价。</li><li>我的行动项（来源、到期、状态）；最新动态信息流（可按交付/平台/商务筛选，每条显示来源）。</li><li>右侧：预警、"Ask OCS" AI 问答与"来自邮件/聊天的建议"（批准/编辑）、未来 7 天日程。</li><li>顶栏：全局搜索（项目、门店、SN/MAC、PO、人员）、多时区时钟、中/英切换、通知。</li></ul>
<h3>4.2 项目组合</h3><ul><li>按阶段统计（Rollout / Pilot / Integration / PoC / Tender / Pre-PoC / Winding down），点击筛选。</li><li>表格：项目、阶段、国家、门店·设备、健康度、下一里程碑、负责人、未关闭项、最后更新。</li><li>健康度由规则计算：有 P0 预警或里程碑延迟 > 5 天 = At risk；客户升级 = Escalated。</li></ul>
<h3>4.3 项目空间（示例：PMI Transition）</h3><ul><li>头部：状态、规模、团队、客户联系人；按钮：周一汇报包、客户视图、新增动态。</li><li>漏斗：市场、门店、传感器、正在安装、G1 受阻、已上线。</li><li>页签 · 市场与关卡：每个市场的门店/传感器、供应商（内部名称）、G1–G5 状态（通过/当前/受阻/未开始）、报价与 PO、安装窗口、下一步。</li><li>页签 · 动态与评论：评论框（发布 / 作为状态更新 / 转为行动项）、时间线（人员、AI 建议、系统事件）、置顶事实。</li><li>页签 · 文档：版本、是否已与客户共享、更新日期。</li></ul>
<h3>4.4 门店（示例：NEINVER SSRR）</h3><ul><li>指标：在线、离线、网速恢复比例、待修交换机、交接文件期限。</li><li>页签 · 设备与网络：交换机问题表（发现、修复、状态）；传感器表（SN·MAC、交换机·端口、IP、平台在线状态、最后在线、校准）。</li><li>页签 · 算法与校准：算法配置（产品、计数线、固件、算法包、变更记录）；校准、访问申请、精度测试、报告、交接包。</li><li>页签 · 时间线与评论。</li></ul>
<h3>4.5 平台与算法</h3><ul><li>设备类型概览（G6/G6S、G6 WiFi、B1、CBox、边缘容器、V-store + OpenAPI）。</li><li>页签：门店配置（启用算法、配置说明、状态）· 版本发布（组件、版本、运行位置、日期、状态）· 精度（目标 vs 最新结果，固定公式）· 已知问题（影响、负责人、目标、状态）。</li></ul>
<h3>4.6 行动项与预警</h3><ul><li>看板：待办 / 进行中 / 等待他人 / 完成；按负责人筛选；卡片显示优先级、项目、负责人、到期、来源。</li><li>预警规则当日命中表（规则、级别、命中数、示例）。</li></ul>
<h3>4.7 商务（仅内部）</h3><ul><li>报价生成器：抬头、税号、Incoterm 与增值税处理、费率档；行项目由设计自动生成；发出前检查清单。</li><li>页签：报价台账（原报价、更正后、原因、增值税处理、状态）· PO 与发票（安装、开票、付款、阻碍）。</li></ul>
<h3>4.8 客户门户（PMI 视角）</h3><ul><li>PMI SSO 登录；页签：概览、市场、请求、审批、表单、报表。</li><li><b>v0.3：</b>“您的请求与问题”表 —— 编号、市场、简化状态（已收到 / 调查中 / 修复中 / 等待您 / 已解决）、承诺日期、最新客户可见更新；“提交请求”按钮。</li><li>市场进度条（已通过关卡数）、供应商匿名、"等待谁"。</li><li>需客户决定：校准审批、日期变更、报价接受；市场输入表单（无需账号，链接填写）；导出到 SharePoint。</li></ul>
<h3>4.9 供应商手机端</h3><ul><li>当日任务：门店、时间窗、设计（型号与数量）、D−2 检查、门店联系人、进度。</li><li>清单逐项完成（到店、每台传感器安装照片、线缆标签、端口与静态 IP、平台在线检查）；报告问题、提交给 PM 确认。</li></ul>
<h3>4.10 案例列表（v0.3）</h3><ul><li>指标：未关闭案例、等待研发（按团队）、无负责人或无 ETA、客户更新逾期、未关联消息。</li><li>表格：优先级、编号、类型、标题、客户·门店、负责人·团队、关联（邮件、工作项、设备）、状态、ETA（含是否改过）、客户是否可见；按团队筛选。</li><li>右侧“收件箱”：未匹配到案例的邮件 / WhatsApp / 门户请求 / 旧工单，AI 给出建议（关联到某案例 / 新建案例 / 转为行动项 / 不是案例），由人确认。</li></ul>
<h3>4.11 案例详情（v0.3）</h3><ul><li>头部：优先级、类型、状态、是否客户可见、客户更新到期；按钮：修改 ETA、附根因关闭、更新客户。</li><li>事实卡：客户·门店、负责人（A）、内部 ETA、对客户承诺日期、SLA、能力矩阵状态。</li><li>AI 摘要（注明来源数量）；统一时间线：来信、发信、钉钉、内部评论、ETA 变更、AI 矛盾提示、测试结果、系统事件；按 全部 / 邮件 / 内部 / 客户可见 筛选。</li><li>输入框带可见性开关；客户更新以草稿形式在用户自己的邮箱中打开（抄送案例地址），OCS 不自动给客户发邮件。</li><li>右侧：工作项（编号、团队、负责人、ETA、状态）、“PMI 看到的内容”预览、ETA 历史（每次变更带原因）、关联对象、人员（RACI）。</li></ul>
<h3>4.12 研发侧 · 钉钉工作卡片（v0.3）</h3><ul><li>新工作项推送到负责团队：AI 案例摘要（中文）、设备数、是否客户可见、已分诊天数。</li><li>按钮：我来负责 / 提问 / 转派；接单后选择 ETA 并填写原因（必填），同步回 OCS 并重算案例 ETA。</li><li>每天 09:30 推送个人队列（无 ETA、超期高亮）。</li></ul>` },
  en:{ t:'4. Screens (one-to-one with the prototype)', h:`
<h3>4.1 Home · my desk</h3><ul><li>Tiles: P0 alerts, actions due this week, installations in 14 days, quotes needing correction.</li><li>My actions (source, due, status); latest updates feed (filter delivery / platform / commercial, source on every item).</li><li>Right: alerts, "Ask OCS" Q&amp;A and "proposed from mail and chats" (approve / edit), next 7 days.</li><li>Top bar: global search (projects, stores, SN/MAC, PO, people), multi-time-zone clock, EN / 中文, notifications.</li></ul>
<h3>4.2 Portfolio</h3><ul><li>Counts by phase (Rollout / Pilot / Integration / PoC / Tender / Pre-PoC / Winding down), click to filter.</li><li>Table: project, phase, countries, stores · devices, health, next milestone, owner, open items, last update.</li><li>Health by rule: a P0 alert or a milestone more than 5 days late = At risk; raised by the client = Escalated.</li></ul>
<h3>4.3 Project workspace (example: PMI Transition)</h3><ul><li>Header: status, size, team, client contacts; buttons: Monday pack, client view, add update.</li><li>Funnel: markets, stores, sensors, installing now, blocked at G1, live.</li><li>Tab · Markets &amp; gates: per market stores / sensors, partner (internal name), G1–G5 state (passed / current / blocked / not started), quote and PO, installation window, next step.</li><li>Tab · Updates &amp; comments: composer (post / post as status update / turn into action), timeline (people, AI proposals, system events), pinned facts.</li><li>Tab · Documents: version, shared with client or not, date.</li></ul>
<h3>4.4 Site (example: NEINVER SSRR)</h3><ul><li>Tiles: online, offline, share with normal network speed, switches to fix, handover due date.</li><li>Tab · Devices &amp; network: switch issues (finding, fix, status); sensors (SN · MAC, switch · port, IP, online from platform, last seen, calibration).</li><li>Tab · Algorithms &amp; calibration: configuration (product, counting lines, firmware, algorithm package, change log); calibration, access request, accuracy test, report, handover pack.</li><li>Tab · Timeline &amp; comments.</li></ul>
<h3>4.5 Platform &amp; algorithms</h3><ul><li>Device families (G6 / G6S, G6 WiFi, B1, CBox, edge container, V-store + OpenAPI).</li><li>Tabs: site configurations (algorithms enabled, notes, status) · releases (component, version, where it runs, date, status) · accuracy (targets vs latest results, fixed formulas) · known issues (affects, owner, target, status).</li></ul>
<h3>4.6 Actions &amp; alerts</h3><ul><li>Board: Open / In progress / Waiting on someone / Done; filter by owner; card shows priority, project, owner, due, source.</li><li>Alert rules with today's hits (rule, level, hits, example).</li></ul>
<h3>4.7 Commercial (internal only)</h3><ul><li>Quote builder: bill-to, tax ID, Incoterm and VAT treatment, rate tier; lines generated from designs; checks before issue.</li><li>Tabs: quote register (issued, corrected, why, VAT treatment, status) · POs and invoices (installed, invoice, paid, blocker).</li></ul>
<h3>4.8 Client portal (PMI view)</h3><ul><li>PMI SSO; tabs: overview, markets, requests, approvals, forms, reports.</li><li><b>v0.3:</b> “Your requests and issues” — number, market, simple status (Received / Investigating / Fix in progress / Waiting on you / Resolved), committed date, latest client-visible update; “Raise a request” button.</li><li>Market progress bars (gates passed), anonymised partners, "waiting on".</li><li>Needs the client's decision: calibration approval, date change, quote acceptance; market forms by link (no account); export to SharePoint.</li></ul>
<h3>4.9 Partner phone app</h3><ul><li>Today's job: store, time window, design (models and count), D−2 check, store contact, progress.</li><li>Checklist step by step (arrival, photo per sensor, cable labels, port and static IP, online check from the platform); report issue, submit for PM confirmation.</li></ul>
<h3>4.10 Cases list (v0.3)</h3><ul><li>Tiles: open cases, waiting on R&amp;D (by team), no owner or no ETA, client update overdue, unlinked messages.</li><li>Table: priority, number, type, title, client · site, owner · team, linked (mails, work items, devices), status, ETA (and whether it moved), visible to client; filter by team.</li><li>Right-hand inbox: mail / WhatsApp / portal requests / old tickets not matched to a case, each with an AI suggestion (attach to case / new case / make an action / not a case) — a person confirms.</li></ul>
<h3>4.11 Case detail (v0.3)</h3><ul><li>Header: priority, type, status, client-visible, client update due; buttons: change ETA, close with root cause, update client.</li><li>Fact cards: client · site, accountable owner, internal ETA, date committed to the client, SLA, capability-matrix status.</li><li>AI summary (with source count); one timeline: mail in, mail out, DingTalk, internal comments, ETA changes, AI contradiction flags, test results, system events; filter all / mail / internal / client-visible.</li><li>Composer with a visibility switch; client updates open as a draft in the user’s own mail client (case address in CC) — OCS never mails clients on its own.</li><li>Right: work items (number, team, owner, ETA, status), “what PMI sees” preview, ETA history (reason on every change), linked objects, people (RACI).</li></ul>
<h3>4.12 R&amp;D side · DingTalk work card (v0.3)</h3><ul><li>New work items are pushed to the owning team: AI case summary in Chinese, device count, client-visible or not, days in triage.</li><li>Buttons: take it / ask delivery / reassign; after taking it, pick an ETA and give a reason (required) — synced back, case ETA recalculated.</li><li>Personal queue digest at 09:30 Beijing (no ETA and overdue highlighted).</li></ul>` } },

{ id:'model',
  zh:{ t:'5. 数据对象与状态', h:`
<p>在 v0.1 对象（Project、Store、Device、Shipment、PO、Invoice）基础上新增：</p>
<table><tr><th>对象</th><th>内容</th></tr>
<tr><td>Client, Market</td><td>客户；市场 = 国家 + 法人 + 税号 + Incoterm + 增值税处理 + 费率档</td></tr>
<tr><td>Gate</td><td>每门店 G1–G5：日期、审批人、证据文件</td></tr>
<tr><td>Design, Quote, QuoteLine</td><td>设计版本（数量、型号 G6/G6S、安装高度、审核人）；报价由设计生成</td></tr>
<tr><td>Config, Release, AccuracyTest</td><td>门店算法配置及变更、固件/软件版本、精度测试与报告</td></tr>
<tr><td>Partner, RateCard, Job</td><td>供应商（对客户显示代号）、内部费率、每次上门任务、供应商发票</td></tr>
<tr><td>Update, Comment, Action</td><td>动态（来源、链接对象）、评论（@、附件）、行动项（负责人、到期、来源、状态）</td></tr>
<tr><td><b>Case（v0.3）</b></td><td>客户、门店/设备、类型、优先级、负责人（A）、状态、内部 ETA、对客户承诺日期、客户可见标题、根因与分类（关闭时必填）</td></tr>
<tr><td><b>WorkItem（v0.3）</b></td><td>所属案例、团队（平台/算法/固件/交付/供应商/客户）、负责人、ETA 与历史（原因）、状态、关联版本或配置变更</td></tr>
<tr><td><b>Message（v0.3）</b></td><td>邮件、钉钉、WhatsApp、门户、评论；原文、线程 ID、发件人、可见性（内部/客户）、匹配置信度</td></tr>
<tr><td><b>Capability, ChangeEvent（v0.3）</b></td><td>能力矩阵条目（状态、负责人、依据）；现场设备变更（类型、范围、客户通知、批次、回滚）</td></tr>
<tr><td>Alert, CalibrationRequest, Document, Contact</td><td>预警及处理记录；48 小时校准访问；版本化文件；联系人与角色</td></tr></table>
<p><b>门店状态：</b>Released → Part A received → Quoted → PO → Compliance approved → Date agreed → Equipment on site → Ready (D−2) → Installed → Calibrated → Go-live → Closed；侧状态 On hold / Cancelled。</p>
<p><b>案例状态：</b>New → Triaged → In progress → Waiting（客户 / 供应商 / 其他团队）→ Fix ready → Verifying → Resolved → Closed（必须填写根因）。<b>工作项状态：</b>Open → Accepted → In progress → In review / test → Done；侧状态 Needs info / Rejected（需原因）。</p>
<p><b>设备状态：</b>Planned → Shipped → Received → Installed → Online → Calibrated；侧状态 Lost / Faulty（DOA/RMA，新 SN 关联旧 SN）。</p>` },
  en:{ t:'5. Data objects and states', h:`
<p>Added to v0.1's objects (Project, Store, Device, Shipment, PO, Invoice):</p>
<table><tr><th>Object</th><th>Content</th></tr>
<tr><td>Client, Market</td><td>Client; market = country + legal entity + tax ID + Incoterm + VAT treatment + rate tier</td></tr>
<tr><td>Gate</td><td>G1–G5 per store: date, approver, evidence file</td></tr>
<tr><td>Design, Quote, QuoteLine</td><td>Design version (count, G6 / G6S, mounting height, checker); quote generated from designs</td></tr>
<tr><td>Config, Release, AccuracyTest</td><td>Algorithm configuration per store and its changes, firmware / software versions, accuracy test and report</td></tr>
<tr><td>Partner, RateCard, Job</td><td>Partner (label to clients), internal rates, job per visit, partner invoice</td></tr>
<tr><td>Update, Comment, Action</td><td>Update (source, linked object), comment (@, files), action (owner, due, source, status)</td></tr>
<tr><td><b>Case (v0.3)</b></td><td>Client, site / devices, type, priority, accountable owner, status, internal ETA, date committed to the client, client-facing title, root cause and category (required to close)</td></tr>
<tr><td><b>WorkItem (v0.3)</b></td><td>Parent case, team (platform / algorithm / firmware / delivery / partner / client), owner, ETA and its history (reasons), status, linked release or configuration change</td></tr>
<tr><td><b>Message (v0.3)</b></td><td>Mail, DingTalk, WhatsApp, portal, comment; original text, thread ID, sender, visibility (internal / client), match confidence</td></tr>
<tr><td><b>Capability, ChangeEvent (v0.3)</b></td><td>Capability-matrix entry (status, owner, evidence); change to live devices (type, scope, client notice, batches, rollback)</td></tr>
<tr><td>Alert, CalibrationRequest, Document, Contact</td><td>Alerts and handling log; 48-hour calibration access; versioned files; contacts and roles</td></tr></table>
<p><b>Store states:</b> Released → Part A received → Quoted → PO → Compliance approved → Date agreed → Equipment on site → Ready (D−2) → Installed → Calibrated → Go-live → Closed; side states On hold / Cancelled.</p>
<p><b>Case states:</b> New → Triaged → In progress → Waiting (client / partner / other team) → Fix ready → Verifying → Resolved → Closed (root cause required). <b>Work item states:</b> Open → Accepted → In progress → In review / test → Done; side states Needs info / Rejected (reason required).</p>
<p><b>Device states:</b> Planned → Shipped → Received → Installed → Online → Calibrated; side states Lost / Faulty (DOA / RMA, new SN linked to the old one).</p>` } },

{ id:'cases',
  zh:{ t:'5a. 案例与工作项规则（v0.3）', h:`
<div class="note"><b>为什么：</b>现有工单系统没人读；问题散落在邮件、钉钉和 WhatsApp 中，没有负责人、没有 ETA、客户不知道进展。OCS 里每个问题只有一条线索，所有团队和客户看到同一个状态。</div>
<table><tr><th>主题</th><th>规则</th></tr>
<tr><td>一个问题 = 一个案例</td><td>案例面向客户问题；内部任务拆成工作项，每个工作项只属于一个团队、一个负责人。案例 ETA = 最晚的阻塞工作项 ETA。</td></tr>
<tr><td>邮件进入</td><td>每个案例有子地址（例：cases+CS-0412@）；主题含 [CS-0412]、同一线程或抄送案例地址的邮件自动关联；其余进入收件箱，AI 建议，由人确认。</td></tr>
<tr><td>邮件发出</td><td>OCS 不自动给客户发邮件。客户更新在用户自己的邮箱中以草稿打开，抄送案例地址，发出后自动回到时间线。</td></tr>
<tr><td>钉钉与 WhatsApp</td><td>研发在钉钉卡片中接单、提问、转派、设 ETA；指定钉钉群消息可一键挂到案例。WhatsApp 由交付转入。</td></tr>
<tr><td>分诊</td><td>值班分诊在 4 个工作小时（P0）/ 1 个工作日内完成：类型、优先级、负责人、工作项。必填：客户、门店、设备 SN、固件/算法版本、时间段、证据（截图、数据、测试包）。缺项退回，不进入研发。</td></tr>
<tr><td>ETA</td><td>工作项接单后 2 个工作日内设 ETA；每次修改必须填写原因，历史保留。内部 ETA 与对客户承诺日期分开：承诺日期由交付负责人设定。</td></tr>
<tr><td>可见性</td><td>默认内部。交付负责人逐条开放给客户：客户只看到客户可见标题、简化状态、承诺日期、客户可见更新和共享文件；看不到内部评论、内部 ETA、研发人员姓名、供应商名称。</td></tr>
<tr><td>客户更新节奏</td><td>P0 每天、P1 每周两次、P2 每周；逾期触发 R20。</td></tr>
<tr><td>关闭</td><td>必须填写根因、分类、修复方式（版本 / 配置 / 现场 / 客户侧 / 无需修改）；与版本或配置变更关联；结果更新能力矩阵。</td></tr>
<tr><td>旧工单系统</td><td>一次性导入未关闭工单（AI 预匹配到案例），之后只读，2027-01-20 后停用 —— 不并行运行两套系统。</td></tr>
<tr><td>指标</td><td>首次响应时间、到 ETA 时间、按时完成率、ETA 推迟次数、重开率、信息完整率、矛盾数；按团队每周看板。</td></tr></table>` },
  en:{ t:'5a. Case and work-item rules (v0.3)', h:`
<div class="note"><b>Why:</b> the current ticket system is not read; problems sit in mail, DingTalk and WhatsApp with no owner, no ETA and no news for the client. In OCS each problem has one thread, and every team and the client see the same status.</div>
<table><tr><th>Topic</th><th>Rule</th></tr>
<tr><td>One problem = one case</td><td>A case is the client-facing problem; internal tasks are work items, each with one team and one owner. Case ETA = the latest ETA among blocking work items.</td></tr>
<tr><td>Mail in</td><td>Each case has a sub-address (e.g. cases+CS-0412@); mail with [CS-0412] in the subject, in a known thread or with the case address in CC is attached automatically; the rest goes to the inbox with an AI suggestion, and a person confirms.</td></tr>
<tr><td>Mail out</td><td>OCS never mails clients on its own. A client update opens as a draft in the user’s own mail client with the case address in CC; once sent it lands back in the timeline.</td></tr>
<tr><td>DingTalk and WhatsApp</td><td>R&amp;D accepts, asks, reassigns and sets ETA from a DingTalk card; messages in named DingTalk groups can be attached to a case in one click. Delivery forwards WhatsApp.</td></tr>
<tr><td>Triage</td><td>The duty triager acts within 4 working hours (P0) / 1 working day: type, priority, owner, work items. Required: client, site, device SN, firmware / algorithm version, time window, evidence (screenshot, data, test pack). Incomplete cases go back; they do not reach R&amp;D.</td></tr>
<tr><td>ETA</td><td>ETA within 2 working days of accepting a work item; every change needs a reason and is kept in history. Internal ETA and the date committed to the client are separate: the delivery owner sets the committed date.</td></tr>
<tr><td>Visibility</td><td>Internal by default. The delivery owner opens items to the client one by one; the client sees the client-facing title, simple status, committed date, client-visible updates and shared files — never internal comments, internal ETA, R&amp;D names or partner names.</td></tr>
<tr><td>Client update rhythm</td><td>P0 daily, P1 twice a week, P2 weekly; overdue fires R20.</td></tr>
<tr><td>Closing</td><td>Root cause, category and fix type (release / configuration / on site / client side / no change) are required; linked to the release or configuration change; the result updates the capability matrix.</td></tr>
<tr><td>Old ticket system</td><td>Open tickets imported once (AI pre-matches them to cases), then read-only, retired after 20 Jan 2027 — no two systems in parallel.</td></tr>
<tr><td>Metrics</td><td>Time to first response, time to ETA, on-time rate, ETA slips, reopen rate, complete-information rate, contradictions; weekly per team.</td></tr></table>` } },

{ id:'gaps',
  zh:{ t:'5b. 知识库中最常见的跨团队问题（v0.3 依据）', h:`
<p>对知识库 2,440 个片段做关键词分类，并逐条阅读 13 个项目的待办清单（10-28）。交付与平台/算法交叉最多：算法 + 平台 339、平台 + 硬件 322、网络 + 硬件 319、网络 + 平台 282（关键词统计，近似值）。</p>
<table><tr><th>问题类型</th><th>例子</th><th>OCS 功能</th><th>阶段</th></tr>
<tr><td>需求 → 工单无人负责</td><td>NEINVER 无人转译需求，Xavier 单点；Heinemann 工单无人看；站会"另行建单"未确认</td><td>案例、分诊值班、必填项、SLA</td><td>V1</td></tr>
<tr><td>设备数据不一致</td><td>NEINVER 四方数量不一致、108 台批量下发失败；Watsons PH 未绑定；PMI 设备清单；Inditex MAC 变化</td><td>设备台账核对</td><td>V1</td></tr>
<tr><td>"能不能做"答案不一</td><td>Heinemann 全局筛选（"不能" vs "下个版本"）；连续年龄模型只在 PMI 设备；德国禁止路人统计；Cainz、Erajaya 功能是否存在</td><td>能力矩阵 + R21 矛盾检测</td><td>V1</td></tr>
<tr><td>欠客户的答复</td><td>PMI DUAID/热力图书面答复；Erajaya、Logista 询问无回复；API 文档绕过 PM 发给客户</td><td>案例客户更新节奏、R20、对外文件经 PM</td><td>V1</td></tr>
<tr><td>现场变更未通知</td><td>Inditex 固件锁机；PMI 夏令时变更未通知；Heinemann 要求发布清单；Decathlon Amiens 客户改分辨率</td><td>变更日历、R22 拦截、客户侧变更登记</td><td>V1.1</td></tr>
<tr><td>精度与验收</td><td>PMI 年龄提醒 13 项过 3 项、83.8% 重复；Heinemann 复测；Logista 现场盗窃测试计划 v2</td><td>测试登记（用例、标准、结果、关联版本）</td><td>V1.1</td></tr>
<tr><td>API 与数据交付</td><td>PMI 前端与 API 不一致、REST 测试环境 500、文档缺失；Heinemann 规格缺口；Vstore → Vmall 字段改名</td><td>接口规格登记（版本、消费方、测试环境状态）</td><td>V1.1</td></tr>
<tr><td>基础设施、校准、安全</td><td>无欧盟校准员、中国无法看实时视频；Watsons MY 过载；Unifree 服务器不可达；渗透测试范围、IP 白名单、CBox 后门待核实</td><td>事件看板、校准容量、安全登记</td><td>V1.1–V2</td></tr>
<tr><td>负责人空缺</td><td>Aaron、Félix 离职；Cainz、Unifree、Erajaya 无 PM；平台 PM 招聘中</td><td>负责人地图、无主项提示、交接清单</td><td>V1</td></tr></table>` },
  en:{ t:'5b. Most frequent cross-team issues in the knowledge base (basis for v0.3)', h:`
<p>Keyword classification of 2,440 knowledge-base chunks plus a line-by-line read of 13 project open-item registers (28 Oct). Delivery crosses platform and algorithms most: algorithm + platform 339, platform + hardware 322, network + hardware 319, network + platform 282 (keyword counts, approximate).</p>

<tr><td>Requirement → ticket has no owner</td><td>NEINVER: nobody translates requirements, Xavier is a single point; Heinemann tickets unread; stand-up “tickets to follow” never confirmed</td><td>Cases, duty triage, required fields, SLA</td><td>V1</td></tr>
<tr><td>Device data disagrees</td><td>NEINVER counts differ across four sources, batch push failed on 108 devices; Watsons PH unbound; PMI inventory request; Inditex MAC change</td><td>Device registry reconciliation</td><td>V1</td></tr>

<tr><td>Replies owed to clients</td><td>PMI DUAID / heat-map written reply; Erajaya and Logista status questions unanswered; API doc sent to a client without the PM</td><td>Client update rhythm, R20, outgoing documents via the PM</td><td>V1</td></tr>
<tr><td>Changes without notice</td><td>Inditex CBox locked by firmware; PMI not told of the DST change; Heinemann asks for a release checklist; Decathlon Amiens changed camera resolution</td><td>Change calendar, R22 block, client-side change log</td><td>V1.1</td></tr>
<tr><td>Accuracy and acceptance</td><td>PMI Age Alert 3 of 13 cases, 83.8% duplicates; Heinemann retest; Logista live theft test plan v2</td><td>Test register (cases, pass marks, results, linked release)</td><td>V1.1</td></tr>

{ id:'alerts',

  en:{ t:'6. Alert rules', h:`
<table><tr><th>#</th><th>Rule</th><th>Fires when</th><th>Level</th></tr>

<tr><td>R2</td><td>Not received 3 days after ETA</td><td>In transit and today > ETA + 3</td><td>P1</td></tr>
<tr><td>R3</td><td>Installed, not calibrated after 7 days</td><td>Installed, no calibration record</td><td>P1</td></tr>
<tr><td>R4</td><td>Store late against plan</td><td>Actual completion > planned</td><td>P2</td></tr>
<tr><td>R5</td><td>Invoice-ready, no invoice</td><td>No invoice 5 working days after G4</td><td>P1</td></tr>
<tr><td>R6</td><td>Duplicate SN / MAC</td><td>Same SN or MAC in two active records</td><td>P0</td></tr>
<tr><td>R7</td><td>Part A missing</td><td>Incomplete 10 calendar days after request</td><td>P1</td></tr>
<tr><td>R8</td><td>Installation date not agreed</td><td>PO approved, no date 20 days before planned installation</td><td>P1</td></tr>
<tr><td>R9</td><td>D−2 final check not passed</td><td>≤ 2 working days to installation, IT / static IP / access not confirmed</td><td>P0</td></tr>

<tr><td>R11</td><td>Calibration access about to expire</td><td>&lt; 6 h of 48-hour access left, not done</td><td>P1</td></tr>

<tr><td>R22</td><td>Change to live devices without client notice</td><td>Firmware / configuration push to live devices with no client-notice record — blocked</td><td>P0</td></tr>
<tr><td>R23</td><td>Message not linked</td><td>Inbox message untouched for 1 working day</td><td>P2</td></tr></table>
<p>P0 same day · P1 within 2 working days · P2 within the week. Every alert has an owner; handling is logged.</p>` } },

{ id:'ai',
  zh:{ t:'7. AI 功能与护栏', h:`
<table><tr><th>功能</th><th>做什么</th><th>护栏</th></tr>
<tr><td>邮件/聊天提取</td><td>读取项目邮箱和钉钉群（只读），提出状态更新和行动项建议</td><td>未经批准不修改数据</td></tr>
<tr><td>问答</td><td>"葡萄牙哪些门店还缺静态 IP？"附带来源链接</td><td>只基于 OCS 数据，显示来源</td></tr>
<tr><td>起草</td><td>给市场/供应商的邮件、周报文字、会议纪要（英/中/当地语言）</td><td>只起草，由人发送</td></tr>
<tr><td>文件识别</td><td>平面图、装箱单、供应商报告 → 字段建议（数量、SN/MAC、日期）</td><td>低置信度字段高亮</td></tr>
<tr><td>邮件 → 案例匹配（v0.3）</td><td>按线程、案例号、客户/门店/SN 提及匹配；建议关联或新建</td><td>低置信度进入收件箱，由人确认</td></tr>
<tr><td>案例摘要与矛盾检测（v0.3）</td><td>按来源生成中/英摘要；发现同一问题的不同答复</td><td>摘要标注来源；矛盾由负责人裁定</td></tr>
<tr><td>客户更新草稿（v0.3）</td><td>从内部中文线程生成英文客户更新，内部姓名替换为团队名</td><td>只起草，用户在自己邮箱发送</td></tr>
<tr><td>检查解释</td><td>说明报价为什么被拦截、如何修改；标记异常数据</td><td>规则决定，AI 解释</td></tr></table>
<p>AI 通过与用户相同的 API 和权限工作；不接触生产数据库；欧盟端点，不用我们的数据训练；提示与回答记录在案。</p>` },
  en:{ t:'7. AI functions and guardrails', h:`
<table><tr><th>Function</th><th>What it does</th><th>Guardrail</th></tr>
<tr><td>Mail / chat extraction</td><td>Reads project mailboxes and DingTalk groups (read-only), proposes status updates and actions</td><td>No data change without approval</td></tr>
<tr><td>Q&amp;A</td><td>"Which Portuguese stores still miss static IPs?" with source links</td><td>OCS data only, sources shown</td></tr>
<tr><td>Drafts</td><td>Mails to markets / partners, weekly pack text, minutes (EN / 中文 / local)</td><td>Drafts only; a person sends</td></tr>
<tr><td>Document intake</td><td>Floor plans, packing lists, partner reports → proposed fields (count, SN / MAC, dates)</td><td>Low-confidence fields highlighted</td></tr>
<tr><td>Mail → case matching (v0.3)</td><td>Matches by thread, case number, client / site / SN mentions; proposes attach or new case</td><td>Low confidence goes to the inbox; a person confirms</td></tr>
<tr><td>Case summary and contradiction check (v0.3)</td><td>EN / 中文 summary with sources; flags different answers to the same question</td><td>Sources shown; the owner decides</td></tr>
<tr><td>Client update drafts (v0.3)</td><td>English client update from an internal Chinese thread; internal names replaced by team names</td><td>Draft only; the user sends from their own mailbox</td></tr>
<tr><td>Check explanations</td><td>Explains why a quote is blocked and how to fix it; flags odd data</td><td>Rules decide; AI explains</td></tr></table>
<p>AI works through the same API and permissions as the user; no access to production databases; EU endpoint, no training on our data; prompts and answers logged.</p>` } },

{ id:'nfr',
  zh:{ t:'8. 非功能需求', h:`
<table><tr><th>类别</th><th>要求</th></tr>
<tr><td>托管</td><td>欧盟区域（法兰克福或阿姆斯特丹）；客户数据不复制到中国；国内团队经公司网络访问</td></tr>
<tr><td>安全</td><td>PMI Entra ID SSO、MFA、按角色和客户隔离（测试覆盖）、审计日志、上线 PMI 门户前渗透测试</td></tr>
<tr><td>备份</td><td>每晚备份、保留 30 天、每月恢复演练；客户定时导出（Excel/CSV 到 SharePoint）</td></tr>
<tr><td>国际化</td><td>中/英界面；UTC 存储、本地时区显示；计划日期只存日期；门店保存 IANA 时区；金额保留原币种，报表按开票日 ECB 汇率</td></tr>
<tr><td>性能与可用性</td><td>列表 ≤ 2 秒，看板 ≤ 3 秒；可用性 99.5%；维护窗口周日 02:00–03:00 UTC</td></tr>
<tr><td>不存储</td><td>安装工姓名（只用代号/首字母）、明文密码、客流数据（留在设备平台）</td></tr>
<tr><td>技术栈（建议）</td><td>TypeScript（React 前端、Node 后端）、PostgreSQL、对象存储、容器；AI 编码代理 + 开发人员逐条审核 + CI</td></tr></table>` },
  en:{ t:'8. Non-functional requirements', h:`
<table><tr><th>Area</th><th>Requirement</th></tr>
<tr><td>Hosting</td><td>EU region (Frankfurt or Amsterdam); no client data copied to China; China team via the company network</td></tr>
<tr><td>Security</td><td>PMI Entra ID SSO, MFA, role and client separation (covered by tests), audit log, penetration test before the PMI portal opens</td></tr>
<tr><td>Backup</td><td>Nightly, 30-day retention, monthly restore test; scheduled client export (Excel / CSV to SharePoint)</td></tr>
<tr><td>Internationalisation</td><td>EN / 中文; UTC stored, local time shown; plan dates as dates only; store keeps its IANA time zone; amounts in original currency, reports at ECB rate on invoice date</td></tr>
<tr><td>Performance and availability</td><td>Lists ≤ 2 s, dashboards ≤ 3 s; 99.5% availability; maintenance Sunday 02:00–03:00 UTC</td></tr>
<tr><td>Not stored</td><td>Technician names (label or initials only), plain-text passwords, footfall data (stays on the device platform)</td></tr>
<tr><td>Stack (proposed)</td><td>TypeScript (React front end, Node back end), PostgreSQL, object storage, containers; AI coding agents + developer review of every change + CI</td></tr></table>` } },

ight: 19px\">{{placeholder}}<\/div>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\"><button type=\"button\" class=\"btn\" style=\"background: #ffffff; color: #005be6\">AI draft from timeline<\/button><button type=\"button\" class=\"btn\" style=\"background: #ffffff; color: #005be6\">Attach file<\/button><\/div>\n              <button type=\"button\" class=\"btn\" style=\"background: #0066ff; color: #ffffff\">{{sendLabel}}<\/button>\n            <\/div>\n            <div class=\"k\">Client mail is never sent by OCS on its own: a draft opens in your mail client with cases+CS-0412@ in CC, so the sent mail lands back here.<\/div>\n          <\/div>\n        <\/section>\n      <\/div>\n\n      <div style=\"flex: 2 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <section class=\"card\" aria-labelledby=\"h-w\">\n          <div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: baseline\"><h2 id=\"h-w\" class=\"h2\">Work items<\/h2><a href=\"#\" style=\"font-size: 13px\">+ Add<\/a><\/div>\n          <template data-for list=\"{{work}}\" as=\"w\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 10px 0; border-top: 1px solid #ececec; display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"display: flex; justify-content: space-between; gap: 8px\"><span style=\"font-size: 12px; font-weight: 700; color: #005be6\">{{w.id}} · {{w.team}}<\/span><span class=\"chip\" style=\"{{w.schip}}\">{{w.s}}<\/span><\/div>\n              <div style=\"font-size: 13px; font-weight: 700; line-height: 18px\">{{w.t}}<\/div>\n              <div style=\"font-size: 12px; line-height: 17px; color: {{w.oc}}\">{{w.owner}} · ETA {{w.eta}}<\/div>\n            <\/div>\n          <\/template>\n          <p class=\"k\" style=\"margin: 10px 0 0 0; line-height: 17px\">Case ETA follows the latest blocking work item. R&amp;D accepts, sets ETA and comments from a DingTalk card — no second login.<\/p>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"h-c\" style=\"border-color: #1f7a3a\">\n          <h2 id=\"h-c\" class=\"h2\">What PMI sees<\/h2>\n          <template data-for list=\"{{client}}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #ececec; font-size: 13px\"><span class=\"k\" style=\"font-size: 13px\">{{c.k}}<\/span><span style=\"font-weight: 700; text-align: right\">{{c.v}}<\/span><\/div>\n          <\/template>\n          <p class=\"k\" style=\"margin: 10px 0 0 0; line-height: 17px\">Internal comments, internal ETA, R&amp;D names and partner names stay hidden. The committed ETA is set by the delivery owner, not copied from R&amp;D.<\/p>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"h-e\">\n          <h2 id=\"h-e\" class=\"h2\">ETA history<\/h2>\n          <template data-for list=\"{{etas}}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"padding: 7px 0; border-bottom: 1px solid #ececec; font-size: 13px; line-height: 18px\"><b>{{h.v}}<\/b> <span class=\"k\">· {{h.when}} · {{h.who}}<\/span><div class=\"k\">{{h.why}}<\/div><\/div>\n          <\/template>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"h-l\">\n          <h2 id=\"h-l\" class=\"h2\">Linked<\/h2>\n          <template data-for list=\"{{links}}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #ececec; font-size: 13px\"><span>{{l.k}}<\/span><span class=\"k\" style=\"text-align: right\">{{l.v}}<\/span><\/div>\n          <\/template>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"h-p\">\n          <h2 id=\"h-p\" class=\"h2\">People<\/h2>\n          <template data-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px\"><span class=\"chip\" style=\"background: #0c1b2b; color: #ffffff; min-width: 14px; text-align: center\">{{p.r}}<\/span><span><b>{{p.n}}<\/b> <span class=\"k\">· {{p.d}}<\/span><\/span><\/div>\n          <\/template>\n        <\/section>\n      <\/div>\n    <\/div>\n  <\/main>\n<\/div>\n", "css": "#scr-Case a{color:#005be6}\n#scr-Case a:hover{color:#0c1b2b}\n#scr-Case .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 14px;color:#c9d3df;text-decoration:none;font-size:14px}\n#scr-Case .nav a:hover{background:#14273b;color:#ffffff}\n#scr-Case .chip{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}\n#scr-Case .card{background:#ffffff;border:1px solid #d9d9d9;padding:20px;box-sizing:border-box}\n#scr-Case .btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 16px;border-radius:3.2rem;font-size:13px;font-weight:700;border:1px solid #0066ff;cursor:pointer;font-family:inherit;text-decoration:none}\n#scr-Case .k{font-size:12px;color:#666666}\n#scr-Case .h2{margin:0 0 12px 0;font-size:17px}", "code": "\nclass Component extends DCLogic {\n  constructor(p){ super(p); this.state = { tab: 'All', vis: 'Internal' }; }\n  renderVals() {\n    const navDef = [['Home','Main.dc.html'],['Portfolio','Portfolio.dc.html'],['Projects','Project.dc.html'],['Sites','Site.dc.html'],['Platform & algorithms','Platform.dc.html'],['Actions & alerts','Actions.dc.html'],['Cases','Cases.dc.html'],['Commercial','Commercial.dc.html'],['Client portal','Client.dc.html'],['Partner app','Partner.dc.html'],['Knowledge','#'],['Admin','#']];\n    const nav = navDef.map((n, i) => ({ label: n[0], href: n[1], style: i === 6 ? 'background:#0066ff;color:#ffffff;font-weight:700' : '' }));\n    const T = { mail at changed, next step, next update date. Internal names are replaced with team names.' : 'Comment for the team. @mention to notify in DingTalk; \"/action\" turns it into an action, \"/item\" into a work item.',\n      sendLabel: isC ? 'Open draft in Outlook' : 'Post comment',\n      facts: [\n        { k:'Client · site', v:'PMI · IQOS Brno Olympia', s:'Czech Republic · Age Alert pilot' },\n        { k:'Accountable', v:'Xavier Xue', s:'Delivery' },\n        { k:'Internal ETA', v:'6 Nov', s:'moved once · from ALG-118' },\n        { k:'Committed to PMI', v:'Retest 10–11 Nov', s:'set by delivery owner' },\n        { k:'SLA', v:'First response met', s:'next client update by 31 Oct' },\n        { k:'Capability', v:'Age Alert on G5: Beta', s:'not for rollout until TST-031 passes' }\n      ],\n      work: [\n        { id:'ALG-118', team:'Algorithm', t:'Root cause: repeated track IDs on the G5 build', owner:'Song Jun', eta:'6 Nov', s:'In development', schip:S.dev, oc:'#666666' },\n        { id:'PLT-207', team:'Platform', t:'De-duplication window in the alert service (stop-gap)', owner:'Jamon', eta:'31 Oct', s:'In review', schip:S.rev, oc:'#666666' },\n        { id:'FW-064', team:'Firmware', t:'G5 firmware flag for single-track output', owner:'No owner — in triage 2 days', eta:'not set', s:'Needs owner', schip:S.no, oc:'#b42318' },\n        { id:'TST-031', team:'Algorithm · client alignment', t:'Retest the 13 PMI cases at Brno Olympia', owner:'Joe', eta:'after FW-064', s:'Planned', schip:S.plan, oc:'#666666' }\n      ],\n      client: [\n        { k:'Status', v:'Fix in progress' },\n        { k:'Retest planned', v:'10–11 Nov' },\n        { k:'Next update', v:'by 31 Oct' },\n        { k:'Owner', v:'Vionvision delivery team' }\n      ],\n      etas: [\n        { v:'6 Nov', when:'29 Oct', who:'Song Jun', why:'Root cause in G5 build; depends on firmware flag FW-064' },\n        { v:'30 Oct', when:'23 Oct', who:'Song Jun', why:'First estimate after reproducing the duplicates' }\n      ],\n      links: [\n        { k:'Mails', v:'6 · 2 threads' },\n        { k:'DingTalk threads', v:'2 · CVA Age Alert, R&D duty' },\n        { k:'Devices', v:'14 · G5 · same build' },\n        { k:'Documents', v:'Test pack 6 Oct · Age Alert spec' },\n        { k:'Release', v:'Fix to ship in G5 build — not scheduled' },\n        { k:'Related cases', v:'CS-0418 (API figures)' }\n      ],\n      people: [\n        { r:'A', n:'Xavier Xue', d:'accountable · delivery' },\n        { r:'R', n:'Song Jun, Jamon', d:'responsible · algorithm, platform' },\n        { r:'C', n:'Joe', d:'consulted · algorithm–client alignment' },\n        { r:'I', n:'Vlad, Hai Tao', d:'informed' },\n        { r:'P', n:'Francesca Versiglia', d:'PMI · sees client-visible items' }\n      ]\n    };\n  }\n}\n", "narrow": false}, {"id": "RnD", "label": "研发卡片 R&D card", "tpl": "\n\n<div style=\"width: 390px; min-height: 844px; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; color: #1f2329; background: #eef0f4; display: flex; flex-direction: column\">\n  <header style=\"background: #ffffff; padding: 14px 16px 12px 16px; border-bottom: 1px solid #e1e4ea; display: flex; align-items: center; gap: 10px\">\n    <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #0c1b2b; color: #66a3ff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center\">OCS<\/div>\n    <div><div style=\"font-size: 15px; font-weight: 700\">OCS 工作通知<\/div><div class=\"en\">Work chat · enterprise app · mock<\/div><\/div>\n  <\/header>\n\n  <main style=\"flex: 1 1 auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px\">\n    <div style=\"text-align: center; font-size: 11px; color: #8a8f99\">今天 10:52<\/div>\n\n    <article style=\"background: #ffffff; border-radius: 10px; overflow: hidden; border: 1px solid #e1e4ea\">\n      <div style=\"background: #fde2e1; color: #b42318; padding: 8px 14px; font-size: 12px; font-weight: 700\">新工作项 · 需要负责人 · P0 <span style=\"font-weight: 400\">· New work item, needs owner<\/span><\/div>\n      <div style=\"padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n        <div>\n          <div style=\"font-size: 12px; color: #005be6; font-weight: 700\">FW-064 · 固件 Firmware<\/div>\n          <div style=\"font-size: 16px; font-weight: 700; line-height: 22px; margin-top: 2px\">G5 固件：单轨迹输出开关<\/div>\n          <div class=\"en\">G5 firmware flag for single-track output<\/div>\n        <\/div>\n        <div style=\"background: #f5f6f8; border-radius: 6px; padding: 10px; font-size: 13px; line-height: 20px\">\n          <b>案例 CS-0412 · PMI 捷克 · 年龄提醒<\/b><br>\n          G5 设备 83.8% 提醒为重复；根因：G5 版本重复轨迹 ID（Song Jun）。需固件开关后复测 PMI 13 条用例。\n          <div class=\"en\" style=\"margin-top: 4px\">AI summary of the case · PMI waits for a retest date<\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px\"><span class=\"chip\" style=\"background: #f0f1f6; color: #1f2329\">14 台设备<\/span><span class=\"chip\" style=\"background: #f0f1f6; color: #1f2329\">客户可见<\/span><span class=\"chip\" style=\"background: #fcefd9; color: #9a5b00\">分诊已 2 天<\/span><\/div>\n\n        <template data-if value=\"{{showStart}}\" hint-placeholder-val=\"{{true}}\">\n          <div style=\"display: flex; gap: 8px\">\n            <button type=\"button\" class=\"b\" onClick=\"{{accept}}\" style=\"background: #0066ff; color: #ffffff; border: 1px solid #0066ff\">我来负责<\/button>\n            <button type=\"button\" class=\"b\" onClick=\"{{ask}}\" style=\"background: #ffffff; color: #0066ff; border: 1px solid #0066ff\">提问<\/button>\n            <button type=\"button\" class=\"b\" style=\"background: #ffffff; color: #1f2329; border: 1px solid #d0d4db\">转派<\/button>\n          <\/div>\n          <div class=\"en\" style=\"text-align: center\">Take it · Ask delivery · Reassign<\/div>\n        <\/template>\n\n        <template data-if value=\"{{showEta}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"font-size: 13px; font-weight: 700\">已接收 · 请在 2 个工作日内设定 ETA <span class=\"en\">Accepted — set ETA<\/span><\/div>\n          <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n            <template data-for list=\"{{etaOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button type=\"button\" onClick=\"{{o.pick}}\" style=\"{{o.style}}\">{{o.label}}<\/button>\n            <\/template>\n          <\/div>\n          <div style=\"font-size: 12px; color: #8a8f99\">原因 / 依赖（必填）Reason or dependency — required<\/div>\n          <div style=\"min-height: 44px; border: 1px solid #d0d4db; border-radius: 6px; padding: 8px; font-size: 13px; color: #1f2329\">{{reason}}<\/div>\n          <button type=\"button\" class=\"b\" onClick=\"{{save}}\" style=\"background: #0066ff; color: #ffffff; border: 1px solid #0066ff; flex: 0 0 auto; width: 100%\">提交 ETA · Save<\/button>\n        <\/template>\n\n        <template data-if value=\"{{showAsk}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"font-size: 13px; line-height: 19px; background: #f0f6ff; padding: 10px; border-radius: 6px\">问题将发给交付负责人 Xavier Xue，并记录在案例时间线（内部）。<div class=\"en\">Question goes to the delivery owner and the case timeline (internal).<\/div><\/div>\n          <button type=\"button\" class=\"b\" onClick=\"{{back}}\" style=\"background: #ffffff; color: #0066ff; border: 1px solid #0066ff; width: 100%\">返回 Back<\/button>\n        <\/template>\n\n        <template data-if value=\"{{showDone}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"background: #e3f1e4; color: #1f7a3a; border-radius: 6px; padding: 10px; font-size: 13px; line-height: 19px\"><b>已同步到 OCS<\/b> · 负责人：你 · ETA {{eta}}<br><span style=\"font-size: 11px\">Synced — case ETA and client update recalculated<\/span><\/div>\n        <\/template>\n\n        <a href=\"Case.dc.html\" style=\"font-size: 13px; color: #005be6; text-decoration: none; border-top: 1px solid #eef0f4; padding-top: 10px\">在 OCS 打开案例 › <span class=\"en\">Open the case in OCS<\/span><\/a>\n      <\/div>\n    <\/article>\n\n    <article style=\"background: #ffffff; border-radius: 10px; border: 1px solid #e1e4ea; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px\">\n      <div style=\"font-size: 13px; font-weight: 700\">我的队列 <span class=\"en\">My queue<\/span><\/div>\n      <template data-for list=\"{{queue}}\" as=\"q\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; border-top: 1px solid #f0f1f4\"><span>{{q.t}}<\/span><span style=\"font-weight: 700; color: {{q.c}}; white-space: nowrap\">{{q.e}}<\/span><\/div>\n      <\/template>\n      <div class=\"en\">每天 09:30 推送 · daily digest 09:30 Beijing<\/div>\n    <\/article>\n  <\/main>\n<\/div>\n", "css": "#scr-RnD .chip{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}\n#scr-RnD .b{flex:1 1 0;min-height:40px;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}\n#scr-RnD .en{font-size:11px;color:#8a8f99}", "code": "\nclass Component extends DCLogic {\n  constructor(p){ super(p); this.state = { step: 'start', eta: '5 Nov' }; }\n  renderVals() {\n    const st = this.state.step;\n    const etaOpts = ['3 Nov','5 Nov','7 Nov','10 Nov'].map((e) => ({ label: e, pick: () => this.setState({ eta: e }), style: 'min-height:36px;padding:0 12px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;border:1px solid ' + (this.state.eta === e ? '#0066ff;background:#0066ff;color:#ffffff' : '#d0d4db;background:#ffffff;color:#1f2329') }));\n    return {\n      showStart: st === 'start', showEta: st === 'eta', showAsk: st === 'ask', showDone: st === 'done',\n      accept: () => this.setState({ step: 'eta' }),\n      ask: () => this.setState({ step: 'ask' }),\n      back: () => this.setState({ step: 'start' }),\n let lang = 'zh';
function renderPRD(){
  const toc = document.getElementById('toc'), doc = document.getElementById('doc');
  toc.innerHTML = ''; doc.innerHTML = '';
  PRD.forEach(s => {
    const c = s[lang];
    const a = document.createElement('a'); a.href = '#s-' + s.id; a.textContent = c.t; toc.appendChild(a);
    const h = document.createElement('h2'); h.id = 's-' + s.id; h.textContent = c.t; doc.appendChild(h);
    const d = document.createElement('div'); d.innerHTML = c.h; doc.appendChild(d);
  });
  document.getElementById('lang').textContent = lang === 'zh' ? 'English' : '中文';
  document.getElementById('ttl').textContent = lang === 'zh' ? 'OCS 统一项目平台 · PRD v0.3' : 'OCS Unified Project Platform · PRD v0.3';
  document.getElementById('t-prd').textContent = lang === 'zh' ? '需求说明 PRD' : 'PRD';
  document.getElementById('t-proto').textContent = lang === 'zh' ? '交互原型 Prototype' : 'Prototype';
  document.getElementById('hint').textContent = lang === 'zh'
    ? '点击侧边栏、页签、筛选和按钮可交互；原型使用真实项目数据，标为 [ ] 的字段为占位。'
    : 'Sidebar, tabs, filters and buttons are clickable. The prototype uses real project data; fields in [ ] are placeholders.';
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}
document.getElementById('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; renderPRD(); };

// ---------- mini runtime for the prototype screens ----------
class DCLogic {
  constructor(props){ this.props = props || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, typeof p === 'function' ? p(this.state) : p); this.__render && this.__render(); }
  forceUpdate(){ this.__render && this.__render(); }
}
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function lookup(path, scopes){
  path = (path || '').trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.');
  for (const sc of scopes){
    if (sc && Object.prototype.hasOwnProperty.call(sc, parts[0])){
      let v = sc[parts[0]];
      for (let i = 1; i < parts.length; i++) v = v == null ? undefined : v[parts[i]];
      return v;
    }
  }
  return undefined;
}
const interp = (str, scopes) => str.replace(HOLE, (m, p) => { const v = lookup(p, scopes); return v == null ? '' : String(v); });
const whole = (str) => { const m = (str || '').match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; };
function kids(src, dst, scopes, ctx){ Array.from(src.childNodes).forEach(n => node(n, dst, scopes, ctx)); }
function node(n, dst, scopes, ctx){
  if (n.nodeType === 3){ dst.appendChild(document.createTextNode(interp(n.nodeValue, scopes))); return; }
  if (n.nodeType !== 1) return;
  if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-for')){
    const list = lookup(whole(n.getAttribute('list')), scopes) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((it, i) => { const sc = { $index: i }; sc[as] = it; kids(n.content, dst, [sc, ...scopes], ctx); });
    return;
  }
  if (n.tagName === 'TEMPLATE' && n.hasAttribute('data-if')){
    if (lookup(whole(n.getAttribute('value')), scopes)) kids(n.content, dst, scopes, ctx);
    return;
  }
  const el = n.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(n.namespaceURI, n.localName) : document.createElement(n.localName);
  for (const a of Array.from(n.attributes)){
    if (a.name.indexOf('hint-') === 0) continue;
    const w = whole(a.value);
    if (a.name.indexOf('on') === 0 && w){
      const fn = lookup(w, scopes);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), (e) => fn(e));
      continue;
    }
    el.setAttribute(a.name, interp(a.value, scopes));
  }
  if (el.localName === 'a'){
    const href = el.getAttribute('href') || '';
    if (href === '#' || /\.dc\.html$/.test(href)) el.addEventListener('click', (e) => { e.preventDefault(); if (href !== '#') ctx.go(href.replace('.dc.html', '')); });
  }
  if (n.localName === 'textarea') el.value = n.textContent; else kids(n, el, scopes, ctx);
  dst.appendChild(el);
}
const inst = {}, parsed = {};
let active = 'Main';
const ctx = { go: (id) => { if (SCREENS.some(s => s.id === id)){ active = id; renderProto(); window.scrollTo(0, 0); } } };
function renderScreen(s){
  if (!parsed[s.id]){ const t = document.createElement('template'); t.innerHTML = s.tpl; parsed[s.id] = t; }
  if (!inst[s.id]){
    const C = new Function('DCLogic', s.code + '\nreturn Component;')(DCLogic);
    inst[s.id] = new C({});
    inst[s.id].__render = () => paint(s);
  }
  paint(s);
}
function paint(s){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const host = document.createElement('div'); host.id = 'scr-' + s.id;
  if (s.narrow) host.className = 'narrow';
  const vals = inst[s.id].renderVals();
  kids(parsed[s.id].content, host, [vals], ctx);
  stage.appendChild(host);
}
function renderProto(){
  const picker = document.getElementById('picker'); picker.innerHTML = '';
  SCREENS.forEach((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab');
    b.textContent = (i + 1) + ' · ' + s.label; b.className = s.id === active ? 'on' : '';
    b.onclick = () => ctx.go(s.id); picker.appendChild(b);
  });
  renderScreen(SCREENS.find(s => s.id === active));
}
document.getElementById('screen-css').textContent = SCREENS.map(s => s.css).join('\n');

// ---------- tabs ----------
function show(which){
  document.getElementById('prd').style.display = which === 'prd' ? 'flex' : 'none';
  document.getElementById('proto').style.display = which === 'proto' ? 'block' : 'none';
  document.getElementById('t-prd').className = which === 'prd' ? 'on' : '';
  document.getElementById('t-proto').className = which === 'proto' ? 'on' : '';
  if (which === 'proto') renderProto();
}
document.getElementById('t-prd').onclick = () => show('prd');
document.getElementById('t-proto').onclick = () => show('proto');
renderPRD();
</script>
