<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OCS — Partner app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:3.2rem;font-size:15px;font-weight:700;border:1px solid #0066ff;cursor:pointer;font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f0f1f6; font-family: Arial, 'Microsoft YaHei', sans-serif; color: #000000; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #0c1b2b; color: #ffffff; padding: 18px 20px 16px 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <img src="/_blob/c1964100bba4ba939b1b6cbb1559b622" alt="Vionvision" style="width: 110px; height: auto">
      <span style="font-size: 12px; color: #a9b4c2">Partner A · technician</span>
    </div>
    <div style="font-size: 20px; font-weight: 500; margin-top: 8px">IQOS Store Ploiești</div>
    <div style="font-size: 13px; color: #c9d3df">Romania · Wed 28 Oct · after store closure</div>
  </header>

  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1 1 auto">
    <section style="background: #ffffff; border: 1px solid #d9d9d9; padding: 14px; font-size: 13px; line-height: 19px">
      <div style="display: flex; justify-content: space-between"><span style="color: #666666">Design</span><span style="font-weight: 700">3 × G6S · v1.0, 21 Sep</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #666666">D−2 check</span><span style="font-weight: 700; color: #1f7a3a">Confirmed by market</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #666666">Store contact</span><span style="font-weight: 700">[name] · [phone]</span></div>
      <div style="margin-top: 10px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666666"><span>Progress</span><span>{{doneCount}} of {{total}}</span></div>
        <div style="height: 8px; background: #f0f1f6; margin-top: 4px; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; background: #0066ff; width: {{pct}}"></div></div>
      </div>
    </section>

    <section aria-label="Checklist" style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
        <button type="button" onClick="{{s.toggle}}" style="{{s.style}}">
          <span style="flex: 0 0 26px; height: 26px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; {{s.box}}">{{s.mark}}</span>
          <span style="flex: 1 1 auto; text-align: left"><span style="display: block; font-size: 14px; font-weight: 700">{{s.t}}</span><span style="display: block; font-size: 12px; color: #666666; margin-top: 2px">{{s.d}}</span></span>
        </button>
      </sc-for>
    </section>
  </div>

  <footer style="padding: 12px 16px 18px 16px; background: #ffffff; border-top: 1px solid #d9d9d9; display: flex; gap: 10px">
    <button type="button" class="btn" style="flex: 1 1 0; background: #ffffff; color: #005be6">Report issue</button>
    <button type="button" class="btn" style="flex: 1 1 0; background: #0066ff; color: #ffffff">Submit to PM</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { done: { 0: true, 1: true } }; }
  renderVals() {
    const def = [
      ['Arrived, store opened', 'Photo of the entrance · time stamped'],
      ['Sensor 1 mounted — entrance', 'Bracket mount · photo with label'],
      ['Sensor 2 mounted — entrance', 'Flush mount · photo with label'],
      ['Sensor 3 mounted — in-store', 'Flush mount · photo with label'],
      ['Cables labelled at both ends', 'Photo at ceiling and at switch'],
      ['Switch port and static IP per sensor', 'Scan the sensor label, pick the port'],
      ['Online check', 'Read from the device platform — 3 of 3 needed']
    ];
    const done = this.state.done;
    const steps = def.map(([t, d], i) => {
      const on = !!done[i];
      return {
        t, d, mark: on ? '✓' : String(i + 1),
        box: on ? 'background:#0066ff;color:#ffffff' : 'background:#ffffff;color:#000000;border:1px solid #d9d9d9',
        style: 'display:flex;gap:12px;align-items:center;width:100%;min-height:58px;padding:10px 12px;background:#ffffff;border:1px solid ' + (on ? '#0066ff' : '#d9d9d9') + ';cursor:pointer;font-family:inherit;color:#000000',
        toggle: () => this.setState({ done: { ...done, [i]: !on } })
      };
    });
    const doneCount = steps.filter((s, i) => !!done[i]).length;
    return { steps, doneCount, total: def.length, pct: Math.round(doneCount / def.length * 100) + '%' };
  }
}
</script>
</body>
</html>
